# Publishes a release only if every gate passes: the full CI checks, and the
# release check (versions match the tag, docs/security-reviews.md clears this
# version, nothing but the review record changed since the reviewed commit).
# The image is built here - never locally - and signed with a build provenance
# attestation, so what runs anywhere is exactly what was checked.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check compares the tag with the reviewed commit
          persist-credentials: false
      - name: Release check
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py "$TAG"

  image:
    needs: [checks, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # no caches in the release path (cache poisoning)
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${REPO}"
          notes=$(cat <<NOTES
          Container image (linux/amd64, linux/arm64):

              docker pull ${image}:${version}
              # pinned: ${image}@${DIGEST}

          Verify that it was built from this tag by this repository's release workflow:

              gh attestation verify oci://${image}@${DIGEST} --repo ${REPO}

          Security review: see docs/security-reviews.md.
          NOTES
          )
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes "$notes" --generate-notes
