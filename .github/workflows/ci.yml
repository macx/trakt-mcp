name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same checks before publishing

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy && uv run mypy --strict scripts/check_release.py
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: Static security analysis
        run: uv run bandit -q -c pyproject.toml -r src scripts
      - name: Dependency audit
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uv run pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t trakt-mcp:ci .
